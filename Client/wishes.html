<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة العروسين | إدارة التهاني والتمنيات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16324F;
    --navy-deep: #0D2338;
    --gold: #C9A961;
    --cream: #FBF8F2;
  }
  body { background: var(--navy-deep); color: var(--cream); font-family: 'Tajawal', sans-serif; padding: 24px; min-height: 100vh; }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { color: var(--gold); text-align: center; margin-bottom: 24px; }
  
  .wish-card {
    background: #16324F; border: 1px solid #2C567F; padding: 18px; border-radius: 12px; margin-bottom: 14px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
  }
  .info b { color: var(--gold); font-size: 16px; }
  .info p { margin-top: 6px; font-size: 14px; color: #D7E4F0; line-height: 1.6; }
  
  .actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-family: inherit; }
  .btn-approve { background: #2E7D32; color: #fff; }
  .btn-reject { background: #C93B2B; color: #fff; }
  
  .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; margin-right: 6px; }
  .badge-pending { background: #E65100; color: #fff; }
  .badge-approved { background: #2E7D32; color: #fff; }
  .badge-rejected { background: #C93B2B; color: #fff; }
</style>
</head>
<body>

<div class="container">
  <h1 id="title">إدارة التمنيات والتهاني</h1>
  <div id="wishes-list"></div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const slug = urlParams.get('id');

  async function loadWishes() {
    // if(!slug) return alert('الرابط غير صحيح');
    const res = await fetch(`/api/invitations/${slug}/admin`);
    const data = await res.json();
    document.getElementById('title').innerText = `إدارة تهاني ${data.groomName} & ${data.brideName}`;

    const list = document.getElementById('wishes-list');
    if (!data.wishes || !data.wishes.length) {
      list.innerHTML = '<p style="text-align:center; opacity:0.8;">لا توجد تهاني مُرسلة بعد.</p>';
      return;
    }

    list.innerHTML = data.wishes.map(w => `
      <div class="wish-card">
        <div class="info">
          <b>${w.name} <span class="badge badge-${w.status}">${w.status}</span></b>
          <p>${w.msg}</p>
        </div>
        <div class="actions">
          ${w.status !== 'approved' ? `<button class="btn btn-approve" onclick="updateWish('${w._id}', 'approved')">قبول</button>` : ''}
          ${w.status !== 'rejected' ? `<button class="btn btn-reject" onclick="updateWish('${w._id}', 'rejected')">رفض</button>` : ''}
        </div>
      </div>
    `).join('');
  }

  async function updateWish(wishId, status) {
    await fetch(`/api/invitations/${slug}/wishes/${wishId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    loadWishes();
  }

  loadWishes();
</script>
</body>
</html>
